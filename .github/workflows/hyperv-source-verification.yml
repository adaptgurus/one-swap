name: Hyper-V Source Verification

on:
  pull_request:
    paths:
      - 'hyperv_helper.rb'
      - 'hyperv_hot_helper.rb'
      - 'hyperv_hot_hardening.rb'
      - 'hyperv_hot_edge_hardening.rb'
      - 'hyperv_state_hardening.rb'
      - 'hyperv_source_security_hardening.rb'
      - 'hyperv_materialization_guard.rb'
      - 'hyperv_import_recovery.rb'
      - 'hyperv_import_recovery_hardening.rb'
      - 'hyperv_virtio_hardening.rb'
      - 'oneswap-hyperv'
      - 'install.sh'
      - 'docs/HYPERV.md'
      - 'docs/HYPERV_HOT_STATE_MACHINE.md'
      - 'oneswap.yaml'
      - 'tests/hyperv_helper_test.rb'
      - 'tests/hyperv_hot_helper_test.rb'
      - 'tests/hyperv_hot_hardening_test.rb'
      - 'tests/hyperv_state_hardening_test.rb'
      - 'tests/hyperv_import_recovery_test.rb'
      - 'tests/hyperv_virtio_hardening_test.rb'
      - '.github/workflows/hyperv-source-verification.yml'

permissions:
  contents: read

jobs:
  hyperv-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Ruby syntax
        run: |
          set -euo pipefail
          ruby -c hyperv_helper.rb
          ruby -c hyperv_hot_helper.rb
          ruby -c hyperv_hot_hardening.rb
          ruby -c hyperv_hot_edge_hardening.rb
          ruby -c hyperv_state_hardening.rb
          ruby -c hyperv_source_security_hardening.rb
          ruby -c hyperv_materialization_guard.rb
          ruby -c hyperv_import_recovery.rb
          ruby -c hyperv_import_recovery_hardening.rb
          ruby -c hyperv_virtio_hardening.rb
          ruby -c oneswap-hyperv
      - name: Focused Hyper-V tests
        run: |
          set -euo pipefail
          ruby -I. tests/hyperv_helper_test.rb
          ruby -I. tests/hyperv_hot_helper_test.rb
          ruby -I. tests/hyperv_hot_hardening_test.rb
          ruby -I. tests/hyperv_state_hardening_test.rb
          ruby -I. tests/hyperv_import_recovery_test.rb
          ruby -I. tests/hyperv_virtio_hardening_test.rb
      - name: Installer syntax
        run: bash -n install.sh
      - name: Security, recovery, source-off and VirtIO invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "StrictHostKeyChecking=yes" hyperv_helper.rb
          grep -q "PasswordAuthentication=no" hyperv_helper.rb
          ! grep -Eq -- '--hyperv-pass(word)?' oneswap-hyperv
          grep -q "SHA-256 mismatch" hyperv_helper.rb
          grep -q "source VM must be Off" hyperv_helper.rb
          grep -q "GetVirtualDiskChanges" hyperv_hot_helper.rb
          grep -q "CreateReferencePoint" hyperv_hot_helper.rb
          grep -q "ExportReferencePoint" hyperv_hot_helper.rb
          grep -q "Stop-VM -VM \$vm -Shutdown" hyperv_hot_helper.rb
          ! grep -q "Stop-VM -VM \$vm -TurnOff" hyperv_hot_helper.rb
          grep -q "qemu-img baseline conversion failed" hyperv_hot_hardening.rb
          grep -q "type='raw'" hyperv_hot_hardening.rb
          grep -q "AllowedVlanIdList" hyperv_hot_hardening.rb
          grep -q "PrimaryVlanId" hyperv_hot_hardening.rb
          grep -q "SecondaryVlanIdList" hyperv_hot_hardening.rb
          grep -q "ConvertTo-Json -InputObject \$nics" hyperv_hot_edge_hardening.rb
          grep -q "File.open(directory, 'r') { |dir| dir.fsync }" hyperv_state_hardening.rb
          grep -q "ambiguous durable-state key" hyperv_state_hardening.rb
          grep -q "Get-VMSecurity -VM \$vm -ErrorAction Stop" hyperv_source_security_hardening.rb
          grep -q "SecureBootTemplate" hyperv_source_security_hardening.rb
          grep -q "SecurityProbeAuthoritative" hyperv_source_security_hardening.rb
          grep -q "SOURCE_OFF_VERIFIED" hyperv_materialization_guard.rb
          grep -q -- "--verify-source-off" oneswap-hyperv
          grep -q "DELTA_CAPTURING" hyperv_import_recovery.rb
          grep -q "DELTA_APPLYING" hyperv_import_recovery.rb
          grep -q "delta_applied_indices" hyperv_import_recovery.rb
          grep -q "LAYERSENTRY_OPERATION_ID" hyperv_import_recovery.rb
          grep -q "multiple OpenNebula Images carry" hyperv_import_recovery.rb
          grep -q "automatic replay is prohibited" hyperv_import_recovery.rb
          grep -q "wait_for_image_ready!(image, index) if server_thread" hyperv_import_recovery_hardening.rb
          grep -q "FileUtils.rm_rf(delta_dir)" hyperv_import_recovery_hardening.rb
          grep -q "agent-driven Hyper-V migration requires guest MAC evidence" hyperv_virtio_hardening.rb
          grep -q "explicit qualified --uefi-sec-path" hyperv_virtio_hardening.rb
          grep -q "MicrosoftUEFICertificateAuthority" tests/hyperv_virtio_hardening_test.rb
          grep -q "hyperv_state_hardening.rb" install.sh
          grep -q "hyperv_source_security_hardening.rb" install.sh
          grep -q "hyperv_materialization_guard.rb" install.sh
          grep -q "hyperv_import_recovery.rb" install.sh
          grep -q "hyperv_import_recovery_hardening.rb" install.sh
          grep -q "hyperv_virtio_hardening.rb" install.sh
          grep -q -- "--guest-os" oneswap-hyperv
          grep -q -- "--expected-guest-macs" oneswap-hyperv
          grep -q "guest agent MAC inventory does not match" hyperv_virtio_hardening.rb
          grep -q "VIRTIO_WIN" hyperv_virtio_hardening.rb
          grep -q "virtio-win bundle" hyperv_virtio_hardening.rb
          grep -q "virt-v2v-in-place failed after source shutdown" hyperv_virtio_hardening.rb
          grep -q "refusing hot-migration cleanup outside PREPARED" hyperv_hot_hardening.rb
