name: OneSwap Runtime Diagnostic

on:
  push:
    branches:
      - 'qual/appliance-runtime-diagnostic-*'

permissions:
  contents: read

jobs:
  diagnose-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils qemu-system-x86 libguestfs-tools curl unzip ovmf
          sudo find /boot -maxdepth 1 -type f -name 'vmlinuz-*' -exec chmod a+r {} +
          export LIBGUESTFS_BACKEND=direct
          libguestfs-test-tool

      - name: Fetch exact qualified Hyper-V image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-diag
          cd runtime-diag
          curl -fL --retry 4 --retry-delay 3 \
            -o qualified-vhdx.zip \
            https://github.com/adaptgurus/one-swap/releases/download/qualification-transfer-35484331416/layersentry-oneswap-7.4.1-qualified-vhdx.zip
          printf '%s  %s\n' 'a5cc1895095f9af63efd7c8f46813d99206438f1a744c5f23e563471eeb46cda' qualified-vhdx.zip | sha256sum -c -
          unzip -q qualified-vhdx.zip
          printf '%s  %s\n' '450f3f39a7fb8ef35f793f430b19544678a2ed8627783e1ad5dd0f5c8c7e1a99' layersentry-oneswap-7.4.1-qualified.vhdx | sha256sum -c -
          qemu-img check layersentry-oneswap-7.4.1-qualified.vhdx

      - name: Inspect offline runtime
        shell: bash
        env:
          LIBGUESTFS_BACKEND: direct
        run: |
          set -euo pipefail
          cd runtime-diag
          cp --reflink=auto layersentry-oneswap-7.4.1-qualified.vhdx inspect.vhdx
          {
            echo '=== fstab ==='
            virt-cat -a inspect.vhdx /etc/fstab || true
            echo '=== os-release ==='
            virt-cat -a inspect.vhdx /etc/os-release || true
            echo '=== init symlink ==='
            virt-ls -l -a inspect.vhdx /sbin/init || true
            echo '=== systemd binary ==='
            virt-ls -l -a inspect.vhdx /lib/systemd/systemd || true
          } | tee offline-files.txt

          virt-customize --no-network -a inspect.vhdx \
            --run-command 'set -eux; echo "=== init target ==="; readlink -f /sbin/init; echo "=== systemd version ==="; /lib/systemd/systemd --version; echo "=== ldd systemd ==="; ldd /lib/systemd/systemd; echo "=== dpkg audit ==="; dpkg --audit; echo "=== dpkg verify ==="; dpkg -V systemd systemd-sysv libc6 libsystemd0 || true; echo "=== package versions ==="; dpkg-query -W systemd systemd-sysv libc6 libsystemd0 perl-base || true; echo "=== initramfs packages ==="; dpkg-query -W initramfs-tools initramfs-tools-core busybox klibc-utils || true; echo "=== boot files ==="; ls -lh /boot; echo "=== initramfs inventory ==="; for i in /boot/initrd.img-*; do echo "--- $i"; test -s "$i"; if command -v lsinitramfs >/dev/null 2>&1; then lsinitramfs "$i" | grep -E "^(init|scripts/|usr/lib/systemd/systemd|lib.*/libc\\.so|usr/sbin/switch_root|bin/busybox|usr/bin/busybox|usr/lib/klibc/bin/run-init)" | head -200 || true; else echo "lsinitramfs missing"; fi; done; echo "=== root identity ==="; findmnt -s / || true; blkid; echo "=== grub root references ==="; grep -R -E "root=|linux.*vmlinuz|initrd" /boot/grub /etc/default/grub 2>/dev/null | head -200 || true; echo "=== machine-id ==="; ls -l /etc/machine-id; cat /etc/machine-id || true' \
            2>&1 | tee runtime-integrity.txt

      - name: Boot exact image under QEMU
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd runtime-diag
          OVMF_CODE="$(find /usr/share/OVMF /usr/share/ovmf -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) 2>/dev/null | head -1)"
          test -n "$OVMF_CODE"
          case "$OVMF_CODE" in
            *4M*) OVMF_VARS="$(find /usr/share/OVMF /usr/share/ovmf -type f -name 'OVMF_VARS_4M.fd' 2>/dev/null | head -1)" ;;
            *) OVMF_VARS="$(find /usr/share/OVMF /usr/share/ovmf -type f -name 'OVMF_VARS.fd' 2>/dev/null | head -1)" ;;
          esac
          test -n "$OVMF_VARS"
          cp "$OVMF_VARS" ovmf-vars.fd
          cp --reflink=auto layersentry-oneswap-7.4.1-qualified.vhdx boot-test.vhdx
          set +e
          timeout 90s qemu-system-x86_64 \
            -machine q35,accel=tcg \
            -m 2048 -smp 2 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=ovmf-vars.fd \
            -drive file=boot-test.vhdx,format=vhdx,if=virtio \
            -nographic -serial mon:stdio -no-reboot \
            2>&1 | tee qemu-boot.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "qemu_exit=$rc" | tee qemu-exit.txt
          grep -E -i 'panic|failed|error|systemd|init|switch_root|run-init|emergency|mount' qemu-boot.txt | tail -300 > qemu-boot-focus.txt || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oneswap-runtime-diagnostic-${{ github.run_id }}
          path: |
            runtime-diag/offline-files.txt
            runtime-diag/runtime-integrity.txt
            runtime-diag/qemu-boot.txt
            runtime-diag/qemu-boot-focus.txt
            runtime-diag/qemu-exit.txt
          retention-days: 14
          if-no-files-found: warn
